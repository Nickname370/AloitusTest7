<!DOCTYPE html>
<html>
<head>
<title>Pelivalikko</title>

<style>
body {
  font-family: Arial;  
  text-align: center;
  background: #222;
  color: white;
}

/* 🔝 Yläpalkki */
.header {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-top: 20px;
  flex-wrap: wrap;
}

/* 🔍 Haku */
#search {
  padding: 8px;
  border-radius: 8px;
  border: none;
  outline: none;
  width: 165px;
}

.random-btn {
  position: absolute;
  top: 38,5px;
  left: 767px;
}

/* 🎲 Random nappi */
.random-btn {
  padding: 6px 7.5px;
  border-radius: 8px;
  width: 50px;
  border: none;
  cursor: pointer;
  background: #ffffff;
  color: white;
  transition: 0.2s;
}

.random-btn:hover {
  transform: scale(1.1);
  background: #ff9800;
}

/* 🔐 Login nappi */
.login-btn {
  padding: 8px 15px;
  background: #4CAF50;
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  transition: 0.2s;
  position: absolute;
  top: 44.5px;
  right: 70px;
}


.login-btn:hover {
  transform: scale(1.07);
  background: #45a049;
}

.info-btn {
  transition: 0.2s;
}

.info-btn:hover {
  transform: scale(1.2);
  cursor: pointer;
  transition: 0.2s;
}

.menu {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 30px;
  flex-wrap: wrap;
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
}

.game {
  background: #333;
  padding: 10px;
  border-radius: 10px;
  width: 150px;
  cursor: pointer;
  transition: 0.3s;
  box-sizing: border-box;
}

.logo {
  font-size: 50px;
  cursor: pointer;
  transition: 0.2s;
}

.logo:hover {
  transform: scale(1.2);
}

.game:hover {
  transform: scale(1.1);
  background: #444;
}

.game img {
  width: 100%;
  border-radius: 8px;
}

.peli-logo {
    font-size: 33px;
    font-weight: bold;
    color: white;
    text-decoration: none;
}

</style>

</head>

<body>

<div class="header">
  <div class="logo" onclick="location.href='alku.html'">🎮</div>
    <a href="alku.html" class="peli-logo">Pelivalikko</a>

  <!-- 🔍 Haku -->
  <input type="text" id="search" placeholder="Hae pelejä...">

  <!-- 🎲 Random -->
  <button class="random-btn" id="randomBtn">🎲</button>

  <button class="info-btn" onclick="location.href='infoa.html'">ℹ️ Tietoa</button>


</div>

<div class="menu">

    <div class="game" onclick="location.href='tuho2.html'">
    <img src="tuho2.png">
	<br><br>
    <p>T U H O 2</p>
  </div>

  <div class="game" onclick="location.href='yhdistä3.html'">
    <img src="yhdistä.png">
    <p>Yhdistelypeli</p>
  </div>
  
    <div class="game" onclick="location.href='kala.html'">
    <img src="kala.png">
	<br>
	<br>
    <p>Kalastuspeli</p>
  </div>
  
  <div class="game" onclick="location.href='Hmmm.html'">
    <img src="Hmmm.png">
    <p>Pikkupelit</p>
  </div>
  
    <div class="game" onclick="location.href='sahkoposti.html'">
    <img src="sahkoposti.png">
    <p>Sähköiskuposti</p>
  </div>
  
    <div class="game" onclick="location.href='tpaita.html'">
    <img src="tpaita.png">
    <p>T-paidan suunnittelija</p>
  </div>
  
    <div class="game" onclick="location.href='sekoilu0.html'">
    <img src="sekoilu.png">
	<br><br>
    <p>Tekstisekoitin</p>
  </div>
  
    <div class="game" onclick="location.href='BRUHGPT.html'">
    <img src="BRUHGPT.png">
	<br><br>
    <p>BruhGPT</p>
  </div>
  
  <div class="game" onclick="location.href='Kaantaja.html'">
    <img src="kaantaja.png">
	<br><br>
    <p>Kääntäjä</p>
  </div>

</div>


<script>

// 🔍 Haku (Korjattu, jotta haku ei pakota block-muotoon)
document.getElementById("search").addEventListener("keyup", function() {
  let input = this.value.toLowerCase();
  let games = document.querySelectorAll(".game");

  games.forEach(game => {
    let text = game.innerText.toLowerCase();
    // Käytetään tyhjää arvoa "" jotta Flexbox-asettelu säilyy
    game.style.display = text.includes(input) ? "" : "none";
  });
});

// 🎲 Random peli
document.getElementById("randomBtn").addEventListener("click", function() {
  let games = document.querySelectorAll(".game");
  let visible = [];

  games.forEach(g => {
    if (g.style.display !== "none") visible.push(g);
  });

  if (visible.length === 0) return;

  let random = visible[Math.floor(Math.random() * visible.length)];
  random.click();
});

</script>

</body>
</html>
